# available (modifier) keys example: option etc. {{{
# M-x: Meta(alt=option) + x
# C-x: control + x
# }}}

# Change the prefix key to C-a: but would conflict with number addition in zsh-vim.  {{{
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# }}}

# split/switch/resize/change layout for panes vim style {{{
bind s split-window -v
bind v split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind = select-layout tiled
# zoom: max(zoom in on) pane
unbind z
bind | resize-pane -Z
# almost-zoom: grow current pane as large as tmux allows, which clamps at the
# minimum size (1 line/col + the orange pane-number border) for the other
# panes instead of hiding them like -Z does. Restore with = (or M-1/M-2).
bind z resize-pane -x 999 -y 999

# resizes
# -r makes these repeatable: after one prefix press, keep hitting the key
# within repeat-time (default 500ms) without pressing prefix again each time
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r - resize-pane -D 5
bind -r + resize-pane -U 5

# option + 1/2/3: select pane layout
bind M-1 select-layout main-vertical
bind M-2 select-layout main-horizontal
# for the more common ones like even-horizontal, even-vertical, just do prefix-space to cycle through (first ones in the cycle)
# }}}

# other keybinds, e.g. toggle synchronize-panes on/off with y {{{

# toggle synchronize-panes on/off with y (sYnchronize - s is taken by (horizontal) Split)
bind y set-window-option synchronize-panes
#}}}

# mouse support: without this, scroll-wheel events aren't captured by tmux at
# all and fall through to the shell, which reads them as repeated arrow-key
# presses (cycling command history instead of scrolling). With mouse on,
# scrolling up auto-enters copy-mode and scrolls the pane's history;
# scrolling back down to the bottom exits copy-mode automatically. {{{
set -g mouse on
# }}}

# copy-mode clipboard: by default, y (and mouse drag-select) only copies into
# tmux's own paste buffer, not the macOS clipboard — so pasting outside tmux
# doesn't work. Pipe the selection through pbcopy instead. copy-mode-vi is
# its own key table, so this doesn't clash with `bind y` (prefix+y, synchronize-panes) above. {{{
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# }}}

# copy-mode vi selection: tmux's vi-mode default binds v to rectangle-toggle
# (block-select), not begin-selection like real vim — so v visibly does
# nothing until a selection already exists. Rebind v to start a normal
# (charwise) selection like vim, and move rectangle-toggle to Ctrl-v, vim's
# actual blockwise-select key. V (line select) is already tmux's default and
# needs no change. {{{
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# }}}

# styling - graphical stuff {{{
# display pane number:
set -g status-right " #{pane_index} "

# Window names displayed
set-window-option -g window-status-format " #I │ #W "
set-window-option -g window-status-current-format " #I │ #W "
set-window-option -g window-status-separator " "

# Tab styling
set -g status-style "fg=colour251,bg=colour236"
set -g window-status-style "fg=colour255,bg=colour239"
set -g window-status-activity-style "fg=colour255,bg=colour239,bright"
set -g window-status-current-style "fg=colour255,bg=colour25,bright"

# Dividing border colours
# inactive: dim but readable at a glance (was near-invisible fg=colour236 on bg=colour235,
# both close to the terminal background)
set -g pane-border-style "fg=colour245,bg=colour238"
# active: bold inverse orange, eye-catching next to the dim inactive strips above
set -g pane-active-border-style "fg=colour235,bg=orange,bold"

# always show each pane's number on its border, so prefix-<number> is a direct jump
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "

set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 3
# uncomment if you want the status to go to center
# set-option -g status-justify "centre"

set-option -g status-left "#[bg=colour234]#[fg=colour39]#S #I.#P #[fg=colour234,bg=default]$RIGHT_CAP"
set-option -g status-left-length 50

set-option -g status-right "#[fg=colour234]#[bg=default]$LEFT_CAP#[bg=colour234]#[fg=colour39] #(~/.tmux-config/ssh-hostname.sh #{pane_tty}) #(~/.tmux-config/battery.sh -t)#[fg=colour29,bg=colour234] %H:%M#[default]"
set-option -g status-right-length 50
# }}}
